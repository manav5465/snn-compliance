<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Form registration</title></head>
  <body>
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <select name="service"><option>Service</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
